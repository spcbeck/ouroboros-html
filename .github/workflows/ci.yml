name: CI & Container Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ouroboros-pipeline:
    name: Build, Verify Pipeline, & Publish GHCR Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-runtime Docker image
        run: |
          docker build -t ouroboros-html:latest -f Dockerfile .

      - name: Run all 20 compiler stages (Stages 0-19)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace ouroboros-html:latest make all

      - name: Run comprehensive HTML5 fixture suite
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace ouroboros-html:latest make test-suite

      - name: Run recursive 2-cycle Ouroboros idempotency loop
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace ouroboros-html:latest make ouroboros CYCLES=2

      - name: Tag and push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag ouroboros-html:latest "ghcr.io/${REPO_LOWER}:latest"
          docker tag ouroboros-html:latest "ghcr.io/${REPO_LOWER}:${{ github.sha }}"
          docker push "ghcr.io/${REPO_LOWER}:latest"
          docker push "ghcr.io/${REPO_LOWER}:${{ github.sha }}"

      - name: Upload generational artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ouroboros-generational-artifacts
          path: artifacts/
          if-no-files-found: ignore
